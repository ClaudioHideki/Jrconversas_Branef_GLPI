name: Branef - GLPI 10 synthetic laboratory
on:
  workflow_dispatch:
  push:
    branches: ['codex/branef-glpi-*-20261104', 'codex/consolidacao-*']
    paths: ['app/**', 'config/**', 'db/**', 'lib/**', 'Gemfile*', 'test/glpi_lab/**', '.github/workflows/glpi-laboratory.yml']
permissions:
  contents: read
jobs:
  glpi10:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: branef_glpi_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: glpi-ci-disposable-only
        ports: ['127.0.0.1:5432:5432']
        options: --health-cmd "pg_isready -U postgres -d branef_glpi_test" --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['127.0.0.1:6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      GLPI_LAB_CONFIRM: isolated-synthetic
      RAILS_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_DATABASE: branef_glpi_test
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: glpi-ci-disposable-only
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY_BASE: glpi-ci-disposable-only-012345678901234567890123456789012345678901234567890123456789
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Assert disposable JRC services publish only on loopback
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
          REDIS_CONTAINER_ID: ${{ job.services.redis.id }}
        run: |
          python3 -B -m unittest discover -s test/glpi_lab -p test_verify_bindings.py
          python3 -B test/glpi_lab/verify_bindings.py "$POSTGRES_CONTAINER_ID" "$REDIS_CONTAINER_ID"
      - name: Prepare synthetic credentials and TLS
        run: |
          python3 test/glpi_lab/prepare.py
          echo '127.0.0.1 glpi.example.invalid' | sudo tee -a /etc/hosts > /dev/null
      - name: Build and install GLPI 10.0.18
        run: >-
          docker compose -p branef-glpi-10-${{ github.run_id }} --env-file test/glpi_lab/.runtime/compose.env
          -f test/glpi_lab/compose.yaml up -d --build --wait --wait-timeout 300
      - name: Verify real API, version, root and limited profile
        run: |
          tls_id=$(docker compose -p branef-glpi-10-${{ github.run_id }} --env-file test/glpi_lab/.runtime/compose.env -f test/glpi_lab/compose.yaml ps -q tls)
          docker inspect --format 'Actual laboratory TLS ports: {{json .NetworkSettings.Ports}}' "$tls_id"
          python3 test/glpi_lab/smoke.py
      - name: Native Ruby dependencies
        run: |
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources /etc/apt/apt-mirrors*.txt; do
            if [ -f "$source" ]; then
              sudo sed -i -E -e 's|https?://azure[.]archive[.]ubuntu[.]com/ubuntu/?|https://archive.ubuntu.com/ubuntu/|g' -e 's#http://(archive|security)[.]ubuntu[.]com/ubuntu/?#https://\1.ubuntu.com/ubuntu/#g' "$source"
            fi
          done
          sudo apt-get -o Acquire::Retries=2 update
          sudo apt-get -o Acquire::Retries=2 install -y --no-install-recommends libpq-dev libvips libvips-dev
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.4'
          bundler: 2.5.16
          bundler-cache: true
      - name: Prepare disposable JRC database and run actual Client Execute Documents
        run: |
          bundle exec rails db:schema:load
          bundle exec rails db:migrate
          bundle exec ruby test/glpi_lab/run.rb
      - name: Laboratory diagnostics
        if: failure()
        run: |
          project=branef-glpi-10-${{ github.run_id }}
          docker compose -p "$project" --env-file test/glpi_lab/.runtime/compose.env -f test/glpi_lab/compose.yaml ps
          tls_id=$(docker compose -p "$project" --env-file test/glpi_lab/.runtime/compose.env -f test/glpi_lab/compose.yaml ps -q tls)
          if [ -n "$tls_id" ]; then
            docker inspect --format 'Requested ports: {{json .HostConfig.PortBindings}}' "$tls_id"
            docker inspect --format 'Actual ports: {{json .NetworkSettings.Ports}}' "$tls_id"
            docker exec "$tls_id" nginx -t
            docker exec "$tls_id" sh -c 'cat /proc/net/tcp /proc/net/tcp6'
          fi
          docker compose -p "$project" --env-file test/glpi_lab/.runtime/compose.env -f test/glpi_lab/compose.yaml logs --tail 70
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glpi10-synthetic-evidence-${{ github.sha }}
          path: |
            test/glpi_lab/.runtime/smoke-results.json
            test/glpi_lab/.runtime/laboratory-results.json
          if-no-files-found: ignore
      - name: Remove only this isolated laboratory
        if: always()
        run: >-
          docker compose -p branef-glpi-10-${{ github.run_id }} --env-file test/glpi_lab/.runtime/compose.env
          -f test/glpi_lab/compose.yaml down --volumes
